name: primeira pipeline

on:
  push:
    branches: ["main"]

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: baixar Codigo do repositorio
        uses: actions/checkout@v4

      - name: configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pytest

      - name: Executar testes
        run: pytest

  
deploy:
    name: Simular Deploy
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar Deploy
        run: echo "Testes passaram! Deploy realizado com sucesso."